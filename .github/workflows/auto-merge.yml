# The reviewed label arms GitHub native auto-merge (merge commit) on the event head
# of a PR into the default branch, unless a check on that head already failed.
# The App only arms, never merges: GitHub merges once the PR_Main ruleset (ci and
# App-issued review on that head) holds for the base in effect at that time. A PR
# that is already mergeable is refused with the merge command to run instead.
# A head change (synchronize) or a base change (edited) disarms with the job
# token and drops the reviewed label.
# Dependabot can arm only for semver-minor or semver-patch updates whose every
# commit author is dependabot[bot].
#
# This workflow arms merge. It does not close issues.
name: Auto Merge

on:
  # This privileged workflow runs from the base repository and checks out no code.
  pull_request_target:
    types: [labeled, synchronize, edited]

# Each job receives only the permissions it needs.
permissions: {}

jobs:
  auto-merge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    # The job token disarms without the App token. GitHub refuses
    # disablePullRequestAutoMerge to a token without contents: write
    # ("Resource not accessible by integration", observed on run 40180871966).
    # This job never executes candidate code.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    if: >-
      github.event_name == 'pull_request_target' &&
      (github.event.action == 'synchronize' ||
        (github.event.action == 'edited' && github.event.changes.base != null) ||
        github.event.label.name == 'reviewed')
    timeout-minutes: 5
    steps:
      # Moved head or base: disable auto-merge before dropping a reviewed label.
      # GH_TOKEN is the job token (contents and pull-requests write), not the app token,
      # so a mint failure cannot leave the merge armed.
      # always() keeps the step reachable if a prior step failed.
      - name: Disarm auto-merge on a moved head
        if: always() && github.event.action != 'labeled'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels) }}
          PR_AUTO_MERGE: ${{ toJSON(github.event.pull_request.auto_merge) }}
        run: |
          set -euo pipefail
          # Writes first. A not-enabled or can't-disable error is success; any
          # other disable failure aborts. Drop reviewed only when the event
          # carried it. A failed view must not skip those writes.
          # Abort only if a follow-up read shows autoMergeRequest still set.
          # armed is the event payload, not the disable exit code: on a
          # non-draft PR disable succeeds even when auto-merge is off.
          # Exit 1 only when that payload was non-null or the event carried reviewed.
          set +e
          disable_out=$(gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --disable-auto 2>&1)
          disable_code=$?
          set -e
          if [ "$disable_code" -ne 0 ]; then
            printf '%s\n' "$disable_out" >&2
            # "not enabled" and a draft "Can't disable auto-merge" are not
            # disable failures. The follow-up read still aborts if
            # autoMergeRequest is set.
            if ! printf '%s' "$disable_out" | grep -qi 'not enabled' \
              && ! printf '%s' "$disable_out" | grep -qi "can't disable auto-merge"; then
              echo "::error::failed to disable auto-merge"
              exit 1
            fi
          fi
          labeled=0
          if printf '%s' "$PR_LABELS" | jq -e 'any(.[]; .name == "reviewed")' >/dev/null; then
            labeled=1
          fi
          if [ "$labeled" -eq 1 ]; then
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label reviewed
          fi
          if ! still=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest'); then
            echo "::error::could not confirm auto-merge is off"
            exit 1
          fi
          if [ -n "$still" ] && [ "$still" != "null" ]; then
              echo "::error::auto-merge still armed after disarm"
              exit 1
          fi
          armed=0
          if [ -n "${PR_AUTO_MERGE:-}" ] && [ "${PR_AUTO_MERGE:-}" != "null" ]; then
            armed=1
          fi
          if [ "$armed" -eq 1 ] || [ "$labeled" -eq 1 ]; then
            echo "::error::head or base moved after review — auto-merge disarmed"
            exit 1
          fi

      # roxabi-ci App token (ephemeral, 1 h) — pushes re-trigger CI,
      # which GITHUB_TOKEN cannot do. Native merge needs contents write and,
      # for a PR touching .github/workflows, workflows write.
      - name: Mint app token (roxabi-ci)
        id: app
        if: github.event.action == 'labeled' && github.event.pull_request.base.ref == github.event.repository.default_branch
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          app-id: ${{ vars.ROXABI_CI_APP_ID }}
          private-key: ${{ secrets.ROXABI_CI_APP_PRIVATE_KEY }}
          permission-checks: read
          permission-contents: write
          permission-pull-requests: write
          permission-statuses: read
          permission-workflows: write

      # Read the real update-type from Dependabot's metadata rather than parsing the
      # PR title: grouped PRs are titled "bump the <group> group…" with no versions,
      # so a title regex never fires for a major hidden in a group, and it can also
      # misread a SHA-pinned action bump ("from 08eba0b to 8f4b7f8") as a major.
      # For a grouped PR, fetch-metadata reports the HIGHEST update-type in the group.
      - name: Fetch dependabot metadata
        id: dependabot-meta
        if: >-
          github.event.action == 'labeled' &&
          github.event.pull_request.base.ref == github.event.repository.default_branch &&
          github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: ${{ steps.app.outputs.token }}

      - name: Enable auto-merge (merge commit)
        id: arm
        if: github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          DEPENDABOT_UPDATE_TYPE: ${{ steps.dependabot-meta.outputs.update-type }}
        run: |
          set -euo pipefail
          refuse() {
            echo "::error::$1"
            exit 1
          }
          # Only the default branch has a ruleset requiring ci and review; gh merges
          # an already mergeable PR into any other branch at once.
          if [ "$BASE_REF" != "$DEFAULT_BRANCH" ]; then
            refuse "refusing auto-merge: PR targets $BASE_REF, not $DEFAULT_BRANCH"
          fi
          # Only verified semver-minor/patch updates with exclusively
          # Dependabot-authored commits can take the Dependabot lane.
          if [ "$AUTHOR" = "dependabot[bot]" ]; then
            case "$DEPENDABOT_UPDATE_TYPE" in
              version-update:semver-minor | version-update:semver-patch) ;;
              *) refuse 'refusing auto-merge: Dependabot update is not semver-minor or semver-patch' ;;
            esac
            if ! commits=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json commits); then
              refuse 'refusing auto-merge: could not read Dependabot commit authors'
            fi
            if ! printf '%s' "$commits" | jq -e \
              '(.commits | length > 0) and all(.commits[]; (.authors | type == "array" and length > 0 and all(.[]; .login == "dependabot[bot]")))' >/dev/null; then
              refuse 'refusing auto-merge: Dependabot PR has a non-Dependabot commit author'
            fi
          fi
          # The label event may be stale, and GitHub offers no expected base on a
          # merge: read the live PR right before each arming call.
          live_check() {
            if ! live=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --json id,baseRefName,headRefOid,mergeStateStatus,statusCheckRollup); then
              refuse 'refusing auto-merge: could not read the pull request'
            fi
            if ! live_base=$(printf '%s' "$live" | jq -er '.baseRefName') || [ "$live_base" != "$DEFAULT_BRANCH" ]; then
              refuse "refusing auto-merge: PR now targets ${live_base:-an unknown branch}, not $DEFAULT_BRANCH"
            fi
            if ! live_head=$(printf '%s' "$live" | jq -er '.headRefOid') || [ "$live_head" != "$HEAD_SHA" ]; then
              refuse 'refusing auto-merge: the head moved after the label'
            fi
            if ! pr_id=$(printf '%s' "$live" | jq -er '.id'); then
              refuse 'refusing auto-merge: could not read the pull request'
            fi
            # Checks outside the ruleset (e.g. trufflehog) do not block native
            # auto-merge, so a head whose check already failed does not arm. Only the
            # latest run of each check counts, and this workflow's own runs (a
            # disarm fails on purpose) never do.
            if ! failed=$(printf '%s' "$live" | jq -er --arg self "$GITHUB_WORKFLOW" '[.statusCheckRollup[]
              | select((.workflowName // "") != $self)
              | {key: [(.__typename // ""), (.workflowName // ""), (.name // .context // "")],
                 at: (.startedAt // .createdAt // ""),
                 failed: (((.conclusion // "") | ascii_downcase | IN("failure", "timed_out", "startup_failure"))
                   or ((.state // "") | ascii_downcase | IN("failure", "error")))}]
              | group_by(.key) | map(max_by(.at)) | map(select(.failed) | .key[2]) | join(", ")'); then
              refuse 'refusing auto-merge: could not read the checks of the head'
            fi
            if [ -n "$failed" ]; then
              refuse "refusing auto-merge: failed checks on the head: $failed"
            fi
            # The App only arms: a direct merge could land on a base changed after
            # this read. A PR that is mergeable now is merged by a person.
            case "$(printf '%s' "$live" | jq -r '.mergeStateStatus')" in
              CLEAN | UNSTABLE | HAS_HOOKS)
                refuse "refusing auto-merge: PR is already mergeable; merge it with: gh pr merge $PR_NUMBER --repo $GITHUB_REPOSITORY --merge --match-head-commit $HEAD_SHA" ;;
            esac
          }
          arm() {
            # shellcheck disable=SC2016 # GraphQL variables, not shell expansions
            gh api graphql -f id="$pr_id" -f head="$HEAD_SHA" -f query='
              mutation($id: ID!, $head: GitObjectID!) {
                enablePullRequestAutoMerge(input: {pullRequestId: $id, expectedHeadOid: $head, mergeMethod: MERGE}) {
                  pullRequest { autoMergeRequest { enabledAt } }
                }
              }' 2>&1
          }
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            refuse 'refusing auto-merge without the reviewed commit'
          fi
          live_check
          if ! out=$(arm); then
            printf '%s\n' "$out" >&2
            if ! printf '%s' "$out" | grep -qi 'already enabled'; then
              refuse 'refusing to enable auto-merge on the reviewed commit'
            fi
            gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --disable-auto
            live_check
            if ! out=$(arm); then
              printf '%s\n' "$out" >&2
              refuse 'refusing to enable auto-merge on the reviewed commit'
            fi
          fi

      # A failed arming attempt, including App-token mint failure, is cleaned up
      # with the independent job token.
      - name: Disarm after failed arming
        if: always() && github.event.action == 'labeled' && steps.arm.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          disable_error=''
          remove_error=''
          cleanup_error=0
          set +e
          disable_out=$(gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --disable-auto 2>&1)
          disable_code=$?
          set -e
          if [ "$disable_code" -ne 0 ]; then
            printf '%s\n' "$disable_out" >&2
            if ! printf '%s' "$disable_out" | grep -qi 'not enabled' \
              && ! printf '%s' "$disable_out" | grep -qi "can't disable auto-merge"; then
              disable_error=$disable_out
              cleanup_error=1
            fi
          fi
          set +e
          remove_out=$(gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label reviewed 2>&1)
          remove_code=$?
          set -e
          if [ "$remove_code" -ne 0 ]; then
            printf '%s\n' "$remove_out" >&2
            remove_error=$remove_out
            cleanup_error=1
          fi
          set +e
          cleanup_state=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json autoMergeRequest,labels 2>&1)
          cleanup_code=$?
          set -e
          if [ "$cleanup_code" -ne 0 ]; then
            printf '::error::could not read auto-merge cleanup state: %s\n' "$cleanup_state"
            exit 1
          fi
          if ! printf '%s' "$cleanup_state" | jq -e \
            '(.autoMergeRequest == null) and ([.labels[].name] | index("reviewed") | not)' >/dev/null; then
            printf '::error::auto-merge cleanup remainder: %s\n' "$cleanup_state"
            cleanup_error=1
          fi
          if [ -n "$disable_error" ]; then
            printf '::error::failed to disable native auto-merge: %s\n' "$disable_error"
          fi
          if [ -n "$remove_error" ]; then
            printf '::error::failed to remove reviewed label: %s\n' "$remove_error"
          fi
          if [ "$cleanup_error" -ne 0 ]; then
            exit 1
          fi
