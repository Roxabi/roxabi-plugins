# Auto-merge PRs that have been reviewed and passed all required checks.
# Enables GitHub's native auto-merge (`gh pr merge --auto --merge`) once the
# latest code-review record by vars.OMP_BUILD_AUTOMATION_LOGIN names this head.
# synchronize disarms first, with the job token, even if that label is gone.
# dependabot[bot] skips the record only. A rebase still disarms — re-label after it.
# Reviewed PRs are not retargeted.
#
# Dependabot guard: semver-major bumps are never auto-merged — they require
# manual validation before merge.
#
# Also closes linked issues after merge, because GITHUB_TOKEN-initiated
# auto-merges don't trigger GitHub's native "Closes #X" issue closure.
name: Auto Merge

on:
  # This privileged workflow is selected from the base repository's default
  # branch. Candidate files are checked out only as isolated admission data.
  pull_request_target:
    types: [labeled, synchronize, closed]
  push:
    branches: [main]

# Each job receives only the permissions it needs.
permissions: {}

jobs:
  auto-merge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action != 'closed' &&
      (github.event.action == 'synchronize' || contains(github.event.pull_request.labels.*.name, 'reviewed'))
    timeout-minutes: 5
    steps:
      # Moved head: disable auto-merge before dropping a reviewed label.
      # GH_TOKEN is the job token (pull-requests: write), not the app token,
      # so a mint failure cannot leave the merge armed.
      # always() keeps the step reachable if a prior step failed.
      - name: Disarm auto-merge on a moved head
        if: always() && github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels) }}
          PR_AUTO_MERGE: ${{ toJSON(github.event.pull_request.auto_merge) }}
        run: |
          set -euo pipefail
          # Writes first. A not-enabled or can't-disable error is success; any
          # other disable failure aborts. Drop reviewed only when the event
          # carried it. A failed view must not skip those writes.
          # Abort only if a follow-up read shows autoMergeRequest still set.
          # armed is the event payload, not the disable exit code: on a
          # non-draft PR disable succeeds even when auto-merge is off.
          # Exit 1 only when that payload was non-null or the event carried reviewed.
          set +e
          disable_out=$(gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --disable-auto 2>&1)
          disable_code=$?
          set -e
          if [ "$disable_code" -ne 0 ]; then
            printf '%s\n' "$disable_out" >&2
            # "not enabled" and a draft "Can't disable auto-merge" are not
            # disable failures. The follow-up read still aborts if
            # autoMergeRequest is set.
            if ! printf '%s' "$disable_out" | grep -qi 'not enabled' \
              && ! printf '%s' "$disable_out" | grep -qi "can't disable auto-merge"; then
              echo "::error::failed to disable auto-merge"
              exit 1
            fi
          fi
          labeled=0
          if printf '%s' "$PR_LABELS" | jq -e 'any(.[]; .name == "reviewed")' >/dev/null; then
            labeled=1
          fi
          if [ "$labeled" -eq 1 ]; then
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label reviewed
          fi
          if ! still=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest'); then
            echo "::error::could not confirm auto-merge is off"
            exit 1
          fi
          if [ -n "$still" ] && [ "$still" != "null" ]; then
              echo "::error::auto-merge still armed after disarm"
              exit 1
          fi
          armed=0
          if [ -n "${PR_AUTO_MERGE:-}" ] && [ "${PR_AUTO_MERGE:-}" != "null" ]; then
            armed=1
          fi
          if [ "$armed" -eq 1 ] || [ "$labeled" -eq 1 ]; then
            echo "::error::head moved after review — auto-merge disarmed"
            exit 1
          fi


      # roxabi-ci App token (ephemeral, 1 h) — pushes re-trigger CI,
      # which GITHUB_TOKEN cannot do.
      - name: Mint app token (roxabi-ci)
        id: app
        if: github.event.action == 'labeled'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.ROXABI_CI_APP_ID }}
          private-key: ${{ secrets.ROXABI_CI_APP_PRIVATE_KEY }}

      # Read the real update-type from Dependabot's metadata rather than parsing the
      # PR title: grouped PRs are titled "bump the <group> group…" with no versions,
      # so a title regex never fires for a major hidden in a group, and it can also
      # misread a SHA-pinned action bump ("from 08eba0b to 8f4b7f8") as a major.
      # For a grouped PR, fetch-metadata reports the HIGHEST update-type in the group.
      - name: Fetch dependabot metadata
        id: dependabot-meta
        if: github.event.action == 'labeled' && github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: ${{ steps.app.outputs.token }}

      - name: Block dependabot semver-major bumps
        if: >-
          github.event.action == 'labeled' &&
          github.event.pull_request.user.login == 'dependabot[bot]' &&
          steps.dependabot-meta.outputs.update-type == 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Auto-merge refused: **semver-major** bump. Manual validation required (e2e / boot the artifact), then merge by hand."
          echo "::error::semver-major dependency bump — auto-merge refused"
          exit 1

      # The reviewed PR's checkout is data for the admission reader only. Never
      # run a script, package manager, config, or preload from this path. Checkout
      # v7 requires this explicit opt-in for fork heads on pull_request_target.
      - name: Checkout reviewed candidate data
        id: candidate
        if: github.event.action == 'labeled' && github.event.pull_request.user.login != 'dependabot[bot]'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .omp-build-gate-candidate
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      # This path is never allowed to inherit a PR-controlled file. The gate
      # below requires both this checkout's successful outcome and its verified
      # repository/ref before it invokes the reader.
      - name: Clear trusted review tooling path
        id: clear-gate-tools
        if: github.event.action == 'labeled' && github.event.pull_request.user.login != 'dependabot[bot]'
        continue-on-error: true
        run: rm -rf .omp-build-gate-tools

      # OMP_BUILD_TOOLING_SHA is a repository variable populated only during
      # explicit T5 activation/bootstrap. pull_request_target keeps the workflow
      # and arming decision base-defined; this immutable pin protects only the
      # reader that inspects candidate data without executing it.
      - name: Checkout pinned review tooling
        id: gate-tools
        if: >-
          github.event.action == 'labeled' &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          vars.OMP_BUILD_TOOLING_SHA != ''
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Roxabi/roxabi-plugins
          ref: ${{ vars.OMP_BUILD_TOOLING_SHA }}
          path: .omp-build-gate-tools
          fetch-depth: 1
          persist-credentials: false

      # No dependency install runs next to the app token: the pinned tooling
      # checkout carries its committed dist/contracts.js bundle.
      - name: Set up pinned Bun for review gate
        id: review-gate-bun
        if: github.event.action == 'labeled' && github.event.pull_request.user.login != 'dependabot[bot]'
        continue-on-error: true
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.4.3
          token: ''

      - name: Enable auto-merge (merge commit)
        id: arm
        if: github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEWER: ${{ vars.OMP_BUILD_AUTOMATION_LOGIN }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          TOOLING_SHA: ${{ vars.OMP_BUILD_TOOLING_SHA }}
          CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
          CLEAR_TOOLS_OUTCOME: ${{ steps.clear-gate-tools.outcome }}
          TOOLS_OUTCOME: ${{ steps.gate-tools.outcome }}
          BUN_OUTCOME: ${{ steps.review-gate-bun.outcome }}
          STOP_GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          BUN_OPTIONS: ''
          BUN_PRELOAD: ''
          NODE_OPTIONS: ''
        run: |
          set -euo pipefail
          refuse() {
            echo "::error::$1"
            exit 1
          }
          # The only intended exception: Dependabot retains the existing
          # semver-major guard above but does not require a human review record.
          if [ "$AUTHOR" = "dependabot[bot]" ]; then
            SHA="$HEAD_SHA"
          else
            if ! [[ "$TOOLING_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              refuse 'refusing auto-merge: OMP_BUILD_TOOLING_SHA must be a 40-lowercase-hex repository variable'
            fi
            if [ "$CLEAR_TOOLS_OUTCOME" != "success" ] || [ "$TOOLS_OUTCOME" != "success" ]; then
              refuse 'refusing auto-merge: immutable trusted review tooling was not available'
            fi
            if [ "$CANDIDATE_OUTCOME" != "success" ] || [ "$BUN_OUTCOME" != "success" ]; then
              refuse 'refusing auto-merge: candidate data checkout or pinned Bun was not available'
            fi
            TOOLS="$GITHUB_WORKSPACE/.omp-build-gate-tools"
            CANDIDATE="$GITHUB_WORKSPACE/.omp-build-gate-candidate"
            if [ ! -f "$TOOLS/plugins/omp-build/scripts/review-gate.ts" ] || [ ! -f "$TOOLS/plugins/omp-build/dist/contracts.js" ]; then
              refuse 'refusing auto-merge: trusted review tooling is incomplete'
            fi
            if ! actual_tooling_sha=$(git -C "$TOOLS" rev-parse HEAD 2>/dev/null) || [ "$actual_tooling_sha" != "$TOOLING_SHA" ]; then
              refuse 'refusing auto-merge: trusted review tooling did not resolve to OMP_BUILD_TOOLING_SHA'
            fi
            if ! tooling_origin=$(git -C "$TOOLS" remote get-url origin 2>/dev/null) || [ "$tooling_origin" != 'https://github.com/Roxabi/roxabi-plugins' ]; then
              refuse 'refusing auto-merge: trusted review tooling did not come from Roxabi/roxabi-plugins'
            fi
            if ! candidate_sha=$(git -C "$CANDIDATE" rev-parse HEAD 2>/dev/null) || [ "$candidate_sha" != "$HEAD_SHA" ]; then
              refuse 'refusing auto-merge: candidate data checkout did not resolve to the PR head'
            fi
            # Candidate data is a sibling directory. Run Bun from the immutable
            # pinned tooling checkout, with no ambient Bun or Node preload.
            if ! gate_result=$(cd "$TOOLS" && bun plugins/omp-build/scripts/review-gate.ts \
              --repository "$GITHUB_REPOSITORY" \
              --pr "$PR_NUMBER" \
              --head "$HEAD_SHA" \
              --automation-login "$REVIEWER" \
              --candidate-cwd "$CANDIDATE" \
              --tooling-sha "$TOOLING_SHA"); then
              printf '%s\n' "$gate_result" >&2
              if [[ "$gate_result" == *'"reason":"ci-failed"'* ]]; then
                observation="$RUNNER_TEMP/omp-build-required-stop.json"
                printf '%s\n' "$gate_result" > "$observation"
                if ! (cd "$TOOLS" && bun plugins/omp-build/scripts/review-stop.ts \
                  --repository "$GITHUB_REPOSITORY" \
                  --pr "$PR_NUMBER" \
                  --head "$HEAD_SHA" \
                  --automation-login "$REVIEWER" \
                  --run-id "$RUN_ID" \
                  --observation "$observation"); then
                  echo "::error::could not persist the observed ci-failed stop"
                fi
              fi
              refuse 'refusing auto-merge: shared review admission refused the current PR'
            fi
            printf '%s\n' "$gate_result"
            SHA="$HEAD_SHA"
          fi
          if [ "$SHA" != "$HEAD_SHA" ] || [ "${#SHA}" -ne 40 ]; then
            refuse 'refusing auto-merge without the reviewed commit'
          fi
          set +e
          out=$(gh pr merge "$PR_NUMBER" --auto --merge --repo "$GITHUB_REPOSITORY" --match-head-commit "$SHA" 2>&1)
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            printf '%s\n' "$out" >&2
            if ! printf '%s' "$out" | grep -qi 'already enabled'; then
              refuse 'refusing to enable auto-merge without the reviewed commit'
            fi
            gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --disable-auto
            if ! gh pr merge "$PR_NUMBER" --auto --merge --repo "$GITHUB_REPOSITORY" --match-head-commit "$SHA"; then
              refuse 'refusing to enable auto-merge without the reviewed commit'
            fi
          fi

      # This runs after every failed or skipped labeled-path admission, including
      # an App-token mint failure before the reader can refuse. It uses the job
      # token so cleanup is independent of the App token used by the reader.
      - name: Disarm failed auto-merge admission
        if: always() && github.event.action == 'labeled' && steps.arm.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          disable_error=''
          remove_error=''
          cleanup_error=0
          set +e
          disable_out=$(gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --disable-auto 2>&1)
          disable_code=$?
          set -e
          if [ "$disable_code" -ne 0 ]; then
            printf '%s\n' "$disable_out" >&2
            if ! printf '%s' "$disable_out" | grep -qi 'not enabled' \
              && ! printf '%s' "$disable_out" | grep -qi "can't disable auto-merge"; then
              disable_error=$disable_out
              cleanup_error=1
            fi
          fi
          set +e
          remove_out=$(gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label reviewed 2>&1)
          remove_code=$?
          set -e
          if [ "$remove_code" -ne 0 ]; then
            printf '%s\n' "$remove_out" >&2
            remove_error=$remove_out
            cleanup_error=1
          fi
          set +e
          cleanup_state=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json autoMergeRequest,labels 2>&1)
          cleanup_code=$?
          set -e
          if [ "$cleanup_code" -ne 0 ]; then
            printf '::error::could not read failed-admission cleanup state: %s\n' "$cleanup_state"
            exit 1
          fi
          if ! printf '%s' "$cleanup_state" | jq -e \
            '(.autoMergeRequest == null) and ([.labels[].name] | index("reviewed") | not)' >/dev/null; then
            printf '::error::failed-admission cleanup remainder: %s\n' "$cleanup_state"
            cleanup_error=1
          fi
          if [ -n "$disable_error" ]; then
            printf '::error::failed to disable native auto-merge: %s\n' "$disable_error"
          fi
          if [ -n "$remove_error" ]; then
            printf '::error::failed to remove reviewed label: %s\n' "$remove_error"
          fi
          if [ "$cleanup_error" -ne 0 ]; then
            exit 1
          fi

  update-behind-prs:
    name: Update behind PRs
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Leave reviewed PRs on the commit that was reviewed
        run: |
          set -euo pipefail
          echo "reviewed PRs are not retargeted — a new head needs a new review"
          exit 0
  close-linked-issues:
    name: Close linked issues
    runs-on: ubuntu-latest
    permissions:
      issues: write
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true
    steps:
      - name: Close issues referenced with closing keywords
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const pattern = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
            const issues = new Set();
            let match;
            while ((match = pattern.exec(body)) !== null) {
              issues.add(parseInt(match[1]));
            }
            if (issues.size === 0) {
              core.info('No closing keywords found in PR body');
              return;
            }
            for (const number of issues) {
              try {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: number,
                  state: 'closed',
                  state_reason: 'completed',
                });
                core.info(`Closed issue #${number}`);
              } catch (error) {
                core.warning(`Failed to close issue #${number}: ${error.message}`);
              }
            }
