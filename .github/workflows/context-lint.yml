name: Context Lint

on:
  pull_request:
    paths:
      - '**/CLAUDE.md'
      - '**/AGENTS.md'
      - '.claude/**'
      - '.grok/**'
      - '.agents/**'
  push:
    branches: [main]
    paths:
      - '**/CLAUDE.md'
      - '**/AGENTS.md'
      - '.claude/**'
      - '.grok/**'
      - '.agents/**'

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  # Processed PR merge → skip suite. Naked push → run suite.
  # ~/projects/ssot/conventions.ssot.md § CI landing
  #
  # GET /commits/{sha}/pulls returns the SIMPLE pull request representation:
  # it carries `state` and `merge_commit_sha` but NOT `merged` (that field only
  # exists on GET /pulls/{number}). A `.merged == true` predicate never matches
  # and every push is classified naked. Fix: `state == "closed" and
  # .merge_commit_sha == $sha`. Matches the generator (dev-core v2.9.1); this
  # committed YAML is patched in place rather than regenerated.
  #
  # Probe is local to this workflow: one gated job, `name: Context lint`
  # → {context lint} (ascii_downcase), N=1.
  classify:
    name: Classify push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      path: ${{ steps.out.outputs.path }}
    steps:
      - id: out
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          path=naked
          n=0
          prs="[]"
          for i in 1 2 3 4 5; do
            prs="$(gh api "repos/${REPO}/commits/${SHA}/pulls")"
            n="$(printf '%s' "$prs" | jq --arg sha "$SHA" '[.[] | select(.state == "closed" and .merge_commit_sha == $sha)] | length')"
            if [ "$n" -gt 0 ]; then
              break
            fi
            if [ "$i" -lt 5 ]; then
              sleep 4
            fi
          done
          if [ "$n" -gt 0 ]; then
            head="$(printf '%s' "$prs" | jq -r --arg sha "$SHA" '[.[] | select(.state == "closed" and .merge_commit_sha == $sha)][0].head.sha')"
            ok="$(gh api --paginate "repos/${REPO}/commits/${head}/check-runs" --jq '[.check_runs[] | select(.conclusion == "success") | (.name | ascii_downcase) | select(. == "context lint")] | unique | length')"
            if [ "$ok" -ge 1 ]; then
              path=pr-merge
            fi
          fi
          echo "path=${path}" >> "$GITHUB_OUTPUT"
          echo "landing path: ${path}"

  context-lint:
    name: Context lint
    needs: [classify]
    if: always() && !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'push' || needs.classify.outputs.path == 'naked')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Lint agent-context files (@imports + placeholders)
        run: |
          set -u
          V=0
          find_context_files() {
            find . \( -name node_modules -o -name .worktrees -o -name worktrees -o -name .git \) -prune -o -type f \( \
              -name 'CLAUDE.md' -o -name 'AGENTS.md' -o \
              \( -name 'SKILL.md' \( -path '*/.grok/skills/*' -o -path '*/.claude/skills/*' -o -path '*/.agents/skills/*' \) \) -o \
              \( -name '*.md' \( -path '*/.grok/rules/*' -o -path '*/.claude/rules/*' -o -path '*/.grok/agents/*' \) \) \
            \) -print
          }
          # dead repo-relative @imports (home-dir @~/... imports are machine-local — skipped on CI)
          while IFS= read -r file; do
            dir=$(dirname "$file")
            while IFS= read -r imp; do
              target=${imp#@}
              case "$target" in "~/"*|/*) continue ;; esac
              if [ ! -e "$dir/$target" ]; then
                echo "::error file=$file::dead @import: $imp"
                V=$((V + 1))
              fi
            done < <(grep -o '^@[^ ]*' "$file" || true)
          done < <(find_context_files)
          # unfilled scaffold placeholders
          while IFS= read -r f; do
            echo "::error file=$f::unfilled scaffold placeholder (gotchas)"
            V=$((V + 1))
          done < <(grep -rl 'Add project-specific gotchas here' --include=CLAUDE.md . 2>/dev/null || true)
          if [ "$V" -eq 0 ]; then
            echo "context-lint: clean"
          else
            echo "context-lint: $V violation(s)"
            exit 1
          fi
