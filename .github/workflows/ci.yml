name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group: {}

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  ci:
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version-file: .bun-version
      - name: Verify bun.lock is committed
        run: git ls-files --error-unmatch bun.lock > /dev/null
      - run: bun install --frozen-lockfile
      - name: Verify omp-build distribution
        run: bun run verify:omp-build-distribution
      - name: Check omp-build quality
        run: bun run quality:omp-build
      - name: Lint
        run: bun lint
      - name: Typecheck
        run: bun typecheck
      # Install before the gate below, which needs actionlint on PATH.
      - name: Install actionlint (workflow schema gate)
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/actionlint"
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            | tar xz -C "${RUNNER_TEMP}/actionlint" actionlint
          echo "${RUNNER_TEMP}/actionlint" >> "$GITHUB_PATH"
      # Schema gate for every committed workflow. `actionlint` with no argument
      # walks .github/workflows itself; passing the directory is an error.
      # release.yml matters most — it is hand-written and deliberately ungoverned
      # by a generator or an N11 byte gate (ADR-021), so this is the only thing
      # standing between a typo and a dead release run.
      - name: Lint workflows (actionlint)
        run: actionlint
      - name: Test (vitest)
        run: bun run test
      - name: Verify action pins resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run tools/verify-action-pins.ts
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install pytest==8.3.5 pyyaml
      - name: Test (pytest)
        run: python3 -m pytest tests/ -v
      - name: Validate plugins
        run: python3 tools/validate_plugins.py
