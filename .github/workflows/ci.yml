name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group: {}

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  ci:
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
      - name: Verify bun.lock is committed
        run: git ls-files --error-unmatch bun.lock > /dev/null
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun lint
      - name: Typecheck
        run: bun typecheck
      # Install before the gate below, which needs actionlint on PATH.
      - name: Install actionlint (workflow schema gate)
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/actionlint"
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            | tar xz -C "${RUNNER_TEMP}/actionlint" actionlint
          echo "${RUNNER_TEMP}/actionlint" >> "$GITHUB_PATH"
      # Schema gate for every committed workflow. `actionlint` with no argument
      # walks .github/workflows itself; passing the directory is an error.
      # release.yml matters most — it is hand-written and deliberately ungoverned
      # by a generator or an N11 byte gate (ADR-021), so this is the only thing
      # standing between a typo and a dead release run.
      - name: Lint workflows (actionlint)
        run: actionlint
      - name: Test (vitest)
        run: bun run test
      - name: Test (cli — bun:test)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cd plugins/dev-core/cli && bun test
      - name: Verify action pins resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run tools/verify-action-pins.ts
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install pytest==8.3.5 pyyaml git+https://github.com/Roxabi/roxabi-vault.git@df12ba1c447ca6f01434db017c57f7645662813c  # main
      - name: Test (pytest)
        # Isolate hex packages: cv and linkedin-apply both own adapters/domain/use_cases.
        run: |
          python3 -m pytest tests/ -v
          python3 -m pytest plugins/cv/tests -v
          python3 -m pytest plugins/linkedin-apply/tests -v
      - name: Validate plugins
        run: python3 tools/validate_plugins.py
      - name: Validate registry sync
        run: |
          set -euo pipefail
          REGISTRY=".claude-plugin/external-registry.json"
          CURATED_FILE=".claude-plugin/curated-marketplaces.json"

          if [ ! -f "$REGISTRY" ] || [ ! -f "$CURATED_FILE" ]; then
            echo "Registry files not found — skipping sync check"
            exit 0
          fi

          REG_NAMES=$(jq -r '.curated_marketplaces[].name' "$REGISTRY" 2>/dev/null | sort || echo "")
          FILE_NAMES=$(jq -r '.marketplaces[].name' "$CURATED_FILE" 2>/dev/null | sort || echo "")

          if [ "$REG_NAMES" != "$FILE_NAMES" ]; then
            echo "ERROR: curated_marketplaces in external-registry.json and curated-marketplaces.json are out of sync"
            echo "  external-registry.json names: $(echo "$REG_NAMES" | tr '\n' ',' | sed 's/,$//')"
            echo "  curated-marketplaces.json names: $(echo "$FILE_NAMES" | tr '\n' ',' | sed 's/,$//')"
            echo "  Update curated-marketplaces.json to mirror external-registry.json curated_marketplaces[]"
            exit 1
          fi

          echo "Registry sync OK — both files agree on curated marketplace names"
