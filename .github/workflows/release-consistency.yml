# Reusable release-consistency gate (spec #353 — S9/S10, D9/D14/D15).
#
# This is artifact (i) of the two-part gate: a `workflow_call`-only reusable
# workflow that holds the *logic*. The triggers (pull_request/push/dispatch)
# live in a per-repo committed caller stub — a reusable workflow's own
# non-workflow_call triggers fire in the HOST repo, never in the caller
# (D15). The caller stub's `uses:` job NAME becomes the required-check context,
# so the single job below is named `release-consistency` byte-for-byte to match
# what `provision-release-gate.sh` sets and step 1's probe reads (D15, S7/S12).
#
# Two paths, one job, branched INSIDE the running job (never a job-level `if:`,
# which reports *skipped* and reads as never-reported — D15c):
#   PR path   (D9)  — promote PRs only (head == staging); everything else is an
#                     early green `exit 0`. Three-way: re-price == PR title core
#                     == newest CHANGELOG heading. Mismatch → red (D5).
#   push path (D14) — version file must be `>=` the max reachable <component>/v*
#                     tag; fail ONLY when the file is strictly BEHIND (`<`).
#                     `version_files: []` → early green.
#
# TRUST MODEL (#374). On the pull_request path the checkout is the PR MERGE ref
# (base + head), so anything read from it can be dictated by the PR author. Split
# accordingly:
#   AUTHORITY (decides whether/how the gate runs) — release.model, release.component
#     → read from the BASE ref (refs/remotes/origin/<base>:.dev/stack.yml). A PR
#       that added `release.model: trunk` (or rewrote release.component) to its own
#       stack.yml would otherwise flip its OWN gate to unconditional early-green.
#   WITNESSES (the claim under check) — PR title core, newest CHANGELOG heading.
#     These ARE the PR's assertion, so they legitimately come from the head.
#   push path — the checkout IS the protected-branch tip, so reading stack.yml
#     directly is already reading the base; no head exists.
#
# TRUST BOUNDARY — WHERE THE DERIVER COMES FROM (#385 item 1; closes FU-2 (a)).
#   $PRICE is NOT the checked-out price.sh. The PR checkout is the merge ref, so
#   a PR that rewrote price.sh would dictate its own verdict. The `Checkout
#   pinned gate tooling` step clones THIS workflow's own repo at
#   job.workflow_sha into .gate-tools/, and $PRICE points there.
#     * The step is CONDITIONAL (`continue-on-error: true`). A failed cross-repo
#       clone — private repo, revoked token, GitHub outage — must NOT fail the
#       JOB in front of the in-job early greens (D15c at JOB granularity), or it
#       deadlocks main in every provisioned repo.
#     * .gate-tools/ IS A PATH IN THE HEAD'S OWN CHECKOUT. The pinned step
#       clears and writes it only when it RUNS; when it is `skipped`
#       (job.workflow_* unpopulated — they are documented as unavailable on
#       GHES) or `failure`d, nothing touches the path, so a
#       `.gate-tools/plugins/dev-core/skills/promote/price.sh` COMMITTED BY THE
#       PR would be what executes. Two answers, both required: the workflow
#       clears the path unconditionally before the pinned checkout (so it owns
#       it), and the gate decides on PROVENANCE, not presence — the deriver
#       counts only when steps.gate_tools.outcome == success (see
#       `price_available` below). A file the head planted is never blessed.
#     * When the pinned copy is unavailable the gate FAILS CLOSED AT THE CALL
#       SITE: never at the job front, and never by falling back to a copy the
#       head could have written. A fallback would silently restore the hole; a
#       front guard would deadlock. So every path that does not derive a version
#       (trunk, head != staging, `version_files: []`) still reaches its `exit 0`,
#       and only the paths that actually run the deriver go red — loudly, naming
#       the pin.
#
# KNOWN-OPEN (do NOT read this gate as fully hardened — tracked as FU-2):
#   (b) The per-repo caller stub is committed into the TARGET repo, so a PR can
#       replace this `uses:` job with `run: exit 0`. Not fixable here: it is a
#       provisioning-time control. See the RESIDUAL RISK block at the top of
#       scripts/provision-release-gate.sh — which the script also prints before
#       it mutates anything — for the three options (ruleset
#       file_path_restriction on .github/workflows/**, CODEOWNERS, org
#       required-workflow) and what each does and does not cover. Until one is
#       in place this gate is honest about drift, not tamper-proof.
#   (c) MIGRATION ORDER. Authority is the BASE stack, so a staging→main promote PR
#       on a repo whose base lacks .dev/stack.yml reads COMPONENT="" → hard red: the
#       PR carrying the migration is unmergeable. Land .dev/stack.yml on the base first.
name: release-consistency

# Quoted so YAML 1.1 does not coerce the `on` key to boolean true.
"on":
  workflow_call:
    inputs:
      version_files_override:
        description: >-
          JSON/YAML list of version-file paths to check on the push/dispatch
          path, overriding release.version_files from .dev/stack.yml. Used to
          exercise the otherwise-universal-no-op push path (S10 verification).
        type: string
        required: false

permissions:
  contents: read

jobs:
  # Job name == required-check context. Do NOT rename without updating
  # provision-release-gate.sh and the step-1 gate probe in lockstep (D15).
  release-consistency:
    name: release-consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 is MANDATORY (D15e). A shallow clone sees ~zero tags and
      # severs tag ancestry at the shallow boundary, so `merge-base --is-ancestor`
      # returns a clean exit 1 that is indistinguishable from "not reachable" —
      # the gate starves its own candidate set and reports GREEN on a drifted
      # repo. The shallow-clone failure is green, not loud.
      - name: Checkout (full history + tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # Full-history checkout still lacks remote-tracking refs for other branches;
      # the gate anchors price.sh (and reads the base stack.yml, #374) at
      # `refs/remotes/origin/<base>`, so materialise every branch (plus tag
      # objects) explicitly. The `refs/remotes/origin/*` refspec is what makes the
      # fully-qualified ref resolvable and unambiguous.
      - name: Fetch branches and tags
        run: git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*'

      # ── #385 item 1: the head must not own .gate-tools/ ──────────────────
      # `.gate-tools/` is a path inside the checkout above, i.e. inside the PR
      # author's own tree on the pull_request path. The pinned checkout below
      # clears and writes it ONLY WHEN IT RUNS; skipped (job.workflow_*
      # unpopulated) or failed (continue-on-error), nothing touches the path and
      # a `.gate-tools/plugins/dev-core/skills/promote/price.sh` committed by the
      # PR is what `$PRICE` would find. Clear it unconditionally so the workflow
      # owns the path whatever the pinned step does next.
      #
      # `continue-on-error: true` for the same D15c reason as the step below:
      # this sits in front of every in-job early green, so it MUST NOT be able to
      # fail the job. It is the braces; the belt is the PROVENANCE check in the
      # Gate step (`price_available`, which requires outcome == success), which
      # is what actually decides — so a clear that somehow fails costs nothing.
      - name: Clear the pinned gate-tooling path
        continue-on-error: true
        run: rm -rf .gate-tools

      # ── #385 item 1: run the deriver from a PINNED copy of THIS workflow's
      # own repo, never from the (PR-author-controlled) checkout above.
      #
      # `job.workflow_repository` / `job.workflow_sha` resolve to the REUSABLE's
      # repo and commit — not the caller stub's — so the clone is exactly the
      # bytes this file was called at. On a runner that does not populate them
      # the `if:` is false, the step is SKIPPED (not failed), its outcome is not
      # `success`, and the lazy guard in the Gate step turns that into a loud red
      # on derive paths only.
      #
      # `continue-on-error: true` is LOAD-BEARING, not defensive dressing: this
      # step sits in front of every in-job early green, and a step that fails
      # here fails the JOB. With zero bypass actors that deadlocks main in every
      # provisioned repo (D15c at job granularity). Failure must arrive at the
      # call site instead — see `price_available` below.
      - name: Checkout pinned gate tooling
        id: gate_tools
        if: ${{ job.workflow_repository != '' && job.workflow_sha != '' }}
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .gate-tools
          fetch-depth: 1
          persist-credentials: false

      - name: Gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PUSH_SHA: ${{ github.sha }}
          VERSION_FILES_OVERRIDE: ${{ inputs.version_files_override }}
          GATE_TOOLS_OUTCOME: ${{ steps.gate_tools.outcome }}
          GATE_PIN: ${{ job.workflow_repository }}@${{ job.workflow_sha }}
        run: |
          set -euo pipefail

          # THE DERIVER IS THE PINNED COPY, NOT THE CHECKOUT (#385 item 1).
          # `plugins/dev-core/skills/promote/price.sh` in the checkout is the PR
          # author's file on the pull_request path; running it would let a PR
          # that rewrites price.sh dictate its own verdict. This path lives in
          # .gate-tools/, which the `Clear the pinned gate-tooling path` step
          # emptied and only the pinned checkout refills.
          #
          # PRESENCE AT THIS PATH IS NOT AUTHORITY. `.gate-tools/` sits in the
          # head's own tree, so the head can commit a file there; the clear step
          # is best-effort by construction (it cannot be allowed to fail the job
          # in front of an early green). The decision therefore rests on
          # PROVENANCE — `price_available` below requires the pinned checkout to
          # have actually run and succeeded.
          #
          # There is NO fallback to a head-writable copy. A fallback is a silent
          # restoration of the hole, so an unavailable pin is a hard red — but
          # only where a version is actually derived (see `price_available`).
          PRICE=".gate-tools/plugins/dev-core/skills/promote/price.sh"
          STACK=".dev/stack.yml"

          # ── config readers (yq preferred, python3 YAML fallback — S2/D15) ──
          # No heredocs: their column-0 terminators would break the YAML block
          # scalar. python3 -c one-liners; YAML is a JSON superset so safe_load
          # parses both list shapes for the override.
          #
          # $1 = the stack file to read; defaults to the checked-out $STACK (correct
          # on the push path — the checkout IS the base). The PR path passes the
          # BASE stack instead (the trust-model split above, #374).
          #
          # Both AUTHORITY readers COERCE on any error (missing file, malformed
          # YAML) rather than aborting under `set -euo pipefail`: a broken base
          # stack.yml must never red every PR (zero bypass actors → unmergeable).
          # An absent/unknown model coerces to staging-train, so the trunk
          # early-green cannot fire on a repo that did not opt in (#371 N9, #374 O1).
          read_component() {
            local f="${1:-$STACK}"
            [ -f "$f" ] || { echo ""; return 0; }
            if command -v yq >/dev/null 2>&1; then
              yq -r '.release.component // ""' "$f" 2>/dev/null || echo ""
            else
              python3 -c 'import sys,yaml; d=yaml.safe_load(open(sys.argv[1])) or {}; print(((d.get("release") or {}).get("component")) or "")' "$f" 2>/dev/null || echo ""
            fi
          }
          read_model() {
            local f="${1:-$STACK}"
            [ -f "$f" ] || { echo "staging-train"; return 0; }
            if command -v yq >/dev/null 2>&1; then
              yq -r '.release.model // "staging-train"' "$f" 2>/dev/null || echo "staging-train"
            else
              python3 -c 'import sys,yaml; d=yaml.safe_load(open(sys.argv[1])) or {}; print(((d.get("release") or {}).get("model")) or "staging-train")' "$f" 2>/dev/null || echo "staging-train"
            fi
          }
          read_version_files() {   # one path per line, ZERO lines for an empty list
            if command -v yq >/dev/null 2>&1; then
              # No `// ""` here. `[]?` on an empty list yields an empty STREAM, and
              # `// ""` turns that stream into one empty line — so `version_files: []`
              # read as ONE element under yq and as ZERO under the python3 branch, and
              # only the python3 branch reached the `version_files empty` early green.
              # ubuntu-latest ships yq, so the fleet default took the long way round
              # and ran the deriver for a check with nothing to check (#385 item 3:
              # that early green has to be reachable WITHOUT a deriver).
              yq -r '.release.version_files[]?' "$STACK"
            else
              python3 -c 'import sys,yaml; d=yaml.safe_load(open(sys.argv[1])) or {}; [print(p) for p in ((d.get("release") or {}).get("version_files") or []) if p]' "$STACK"
            fi
          }
          parse_override() {       # override string (JSON/YAML list) → one path per line
            python3 -c 'import sys,yaml; v=yaml.safe_load(sys.argv[1]) if sys.argv[1].strip() else []; v=[v] if isinstance(v,str) else (v or []); [print(p) for p in v if p]' "$VERSION_FILES_OVERRIDE"
          }

          # ── PROVENANCE, NOT PRESENCE (#385 item 1) ──
          # The deriver counts only when the step that writes it actually RAN
          # and SUCCEEDED. `[ -f "$PRICE" ]` alone asks the wrong question: the
          # path is inside the head's own checkout, and the pinned step touches
          # it only when it runs — `skipped` (job.workflow_* unpopulated, e.g.
          # GHES) and `failure` (continue-on-error) both leave whatever the head
          # committed at that path, and running it is the hole restored with no
          # log signal at all. `steps.gate_tools.outcome` is the one witness the
          # head cannot write, so it decides; the file check then catches a clone
          # that landed without the deriver (path moved, sparse checkout).
          #
          # Function DEFINITIONS only — they change no control flow and therefore
          # cannot sit "in front of" an early green. The decision is taken by the
          # `price_available ||` guards at the two call sites (#385 items 1 + 3).
          price_available() {
            [ "${GATE_TOOLS_OUTCOME:-}" = "success" ] && [ -f "$PRICE" ]
          }

          price_unavailable() {
            {
              echo "release-consistency: the pinned deriver is unavailable — refusing to derive a version (#385)."
              echo "  pinned source        : ${GATE_PIN:-<unresolved>}"
              echo "  pin checkout outcome : ${GATE_TOOLS_OUTCOME:-<unknown>} (must be 'success')"
              echo "  expected file        : ${PRICE}"
              echo "  This gate does NOT fall back to a copy the head could have written: on a"
              echo "  pull_request the checkout is the merge ref, so a PR that rewrote price.sh —"
              echo "  or simply COMMITTED one at ${PRICE} — would dictate its own verdict. Only"
              echo "  bytes written by a pinned checkout that ran and succeeded are trusted."
              echo "  Re-run the job; if it persists, the reusable workflow's own repository is"
              echo "  unreachable from this runner."
            } >&2
          }

          # X.Y.Z core of a version file (first strict triple, e.g. version = "0.24.1").
          file_version() { grep -oE '[0-9]+\.[0-9]+\.[0-9]+' "$1" | head -n1; }

          # Newest real CHANGELOG heading (skips "## Unreleased").
          changelog_version() {
            grep -oE '^##[[:space:]]+\[?v?[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md 2>/dev/null \
              | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1
          }

          # The BASE floor (max reachable <component>/v* tag, D1/D2) comes from the deriver
          # itself: `price.sh --base-only`. The push path used to hand-copy that selection loop
          # here — a second implementation of the "sole deriver" predicate (D10) that could drift
          # from price.sh silently. It is now a single source (#369). rc 10 = no reachable tag.

          # ══════════════════════════════════════════════════════════════════
          # PR path (D9) — promote PRs only
          # ══════════════════════════════════════════════════════════════════
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # AUTHORITY from the BASE ref, never the PR head (#374 trust model). A
            # PR that added `release.model: trunk` (or rewrote release.component) to
            # its own stack.yml must not decide whether this gate runs. Materialise
            # the base stack.yml; if the base has none (fresh repo / first provision)
            # the readers coerce (staging-train / empty component) — fail-safe.
            # Fully-qualified refs/remotes/… so a tag named `origin/<base>` cannot
            # shadow the remote-tracking ref (an ambiguous `origin/<base>` would let
            # the head re-supply authority under a decoy tag).
            BASE_STACK="$(mktemp)"
            git show "refs/remotes/origin/${PR_BASE_REF}:${STACK}" > "$BASE_STACK" 2>/dev/null || : > "$BASE_STACK"

            # Trunk mode (#371 N7/N8): a trunk repo has no staging→main promotion
            # PR — a release is cut by pushing an annotated tag (ADR-021), and the
            # push-path floor below still guards at-rest drift. The three-way
            # promote-PR check does not apply, so every PR is an early GREEN (a
            # real check-run, never a skip — D9/D15c). Must precede the head gate.
            if [ "$(read_model "$BASE_STACK")" = "trunk" ]; then
              echo "trunk mode (base ${PR_BASE_REF}) — no promotion PR to check; the push-path floor still guards at-rest drift — early green"
              exit 0
            fi
            # Scope gate FIRST, inside the job: a non-promote (head != staging)
            # carries no version → a three-way parse would fail red → with zero
            # bypass actors the PR would be unmergeable forever. Early GREEN
            # (a real check-run, never a skip — D9/D15c).
            if [ "$PR_HEAD_REF" != "staging" ]; then
              echo "not-a-promote (head=${PR_HEAD_REF:-?} != staging) — early green"
              exit 0
            fi

            COMPONENT=$(read_component "$BASE_STACK")
            if [ -z "$COMPONENT" ]; then
              echo "release-consistency: release.component missing/null in base ${PR_BASE_REF}:${STACK} (D13)" >&2
              exit 1
            fi

            # ── LAZY $PRICE GUARD (#385 item 3). PLACEMENT IS LOAD-BEARING ──
            # It sits HERE, immediately before the only `bash "$PRICE"` on this
            # path, and never above the early greens. Hoisted anywhere earlier it
            # would run in front of the trunk / head!=staging exits: a repo whose
            # pinned clone failed (or that predates this file) would red EVERY PR,
            # and with zero bypass actors red == unmergeable. That deadlock is the
            # P1 defect the #374 review killed; the guard is safe only when it is
            # unreachable except on the paths that genuinely need the deriver.
            price_available || { price_unavailable; exit 1; }

            # Derive from the PR's own head (re-price per head SHA), anchored at the
            # fully-qualified base ref (never a bare `origin/<base>` — B1 ambiguity).
            set +e
            DERIVED=$(bash "$PRICE" "$COMPONENT" "refs/remotes/origin/${PR_BASE_REF}" "refs/remotes/origin/${PR_BASE_REF}" "$PR_HEAD_SHA")
            rc=$?
            set -e

            TITLE_VER=$(printf '%s' "$PR_TITLE" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)
            CL_VER=$(changelog_version || true)

            if [ "$rc" -eq 10 ]; then
              # First release — no tag floor, so price.sh emits no version. The
              # gate degrades to witness agreement (title == CHANGELOG heading).
              echo "release-consistency: no reachable ${COMPONENT}/v* tag — first release (price.sh exit 10)"
              if [ -n "$TITLE_VER" ] && [ "$TITLE_VER" = "$CL_VER" ]; then
                echo "first release ${TITLE_VER}: title == CHANGELOG heading — green"
                exit 0
              fi
              echo "release-consistency: first-release witnesses disagree — title='${TITLE_VER}' changelog='${CL_VER}'" >&2
              exit 1
            elif [ "$rc" -ne 0 ]; then
              echo "release-consistency: price.sh hard error (exit ${rc})" >&2
              exit "$rc"
            fi

            echo "re-price=${DERIVED}  title=${TITLE_VER}  changelog=${CL_VER}"
            if [ "$DERIVED" = "$TITLE_VER" ] && [ "$DERIVED" = "$CL_VER" ]; then
              echo "three-way agreement on ${DERIVED} — green"
              exit 0
            fi
            {
              echo "release-consistency: three-way DISAGREEMENT (D5) — the promotion PR is stale."
              echo "  derived (authoritative) : ${DERIVED}"
              echo "  PR title core           : ${TITLE_VER:-<none>}"
              echo "  newest CHANGELOG heading: ${CL_VER:-<none>}"
              echo "  Re-run /promote to re-price. Nothing shipped, nothing released."
            } >&2
            exit 1
          fi

          # ══════════════════════════════════════════════════════════════════
          # push / workflow_dispatch path (D14) — at-rest floor check on main
          # ══════════════════════════════════════════════════════════════════
          # Fail CLOSED on a missing contract — push path ONLY. `read_version_files`
          # carries no [ -f ] coercion by design, and `mapfile < <(read_version_files)`
          # swallows the subshell failure under `set -euo pipefail`: n=0 then reads as
          # `version_files: []` → "nothing to check" early GREEN, i.e. a wrong/absent
          # $STACK DISARMS the at-rest floor in green. It sits below the whole PR
          # `if … fi` (every branch of which exits), so it can never fire on a
          # pull_request: with zero bypass actors a guard above the trunk /
          # head!=staging early greens would make every PR on a not-yet-migrated base
          # unmergeable — the FU-2 (c) trap itself.
          [ -f "$STACK" ] || { echo "::error::release-consistency: ${STACK} absent — refusing to gate" >&2; exit 1; }

          # version_files: override input wins, else release.version_files.
          if [ -n "${VERSION_FILES_OVERRIDE:-}" ]; then
            mapfile -t VFILES < <(parse_override)
            echo "using version_files_override: ${VFILES[*]:-<empty>}"
          else
            mapfile -t VFILES < <(read_version_files)
          fi

          if [ "${#VFILES[@]}" -eq 0 ]; then
            echo "version_files empty — nothing to check (early green, D12/D14)"
            exit 0
          fi

          COMPONENT=$(read_component)
          if [ -z "$COMPONENT" ]; then
            echo "release-consistency: release.component missing/null in ${STACK} (D13)" >&2
            exit 1
          fi

          ANCHOR="${PUSH_SHA:-HEAD}"

          # ── LAZY $PRICE GUARD (#385 item 3), same placement rule ──
          # Below the `version_files: []` early green, immediately above the only
          # `bash "$PRICE"` on this path. Above that early green it would red every
          # push to main on the shipped default `version_files: []` — i.e. the
          # whole fleet — for a gate that had nothing to check.
          price_available || { price_unavailable; exit 1; }
          set +e
          TAG=$(bash "$PRICE" --base-only "$COMPONENT" "$ANCHOR")
          trc=$?
          set -e
          if [ "$trc" -eq 10 ]; then
            echo "no reachable ${COMPONENT}/v* tag — nothing to be behind of (early green)"
            exit 0
          elif [ "$trc" -ne 0 ]; then
            echo "release-consistency: price.sh --base-only failed (exit ${trc})" >&2
            exit "$trc"
          fi

          status=0
          for f in "${VFILES[@]}"; do
            [ -n "$f" ] || continue
            if [ ! -f "$f" ]; then
              echo "release-consistency: version file '${f}' does not exist" >&2
              status=1
              continue
            fi
            FVER=$(file_version "$f" || true)
            if [ -z "$FVER" ]; then
              echo "release-consistency: no X.Y.Z version found in '${f}'" >&2
              status=1
              continue
            fi
            # BEHIND ⇔ file != tag AND file sorts strictly lowest (sort -V, never
            # [[ < ]] which reads 0.10.0 < 0.9.0). Ahead is legitimate between a
            # pre-merge stamp and the post-merge tag cut (D14) → never fail.
            lowest=$(printf '%s\n%s\n' "$FVER" "$TAG" | sort -V | head -n1)
            if [ "$FVER" != "$TAG" ] && [ "$lowest" = "$FVER" ]; then
              echo "release-consistency: '${f}' is BEHIND — file=${FVER} < newest reachable tag=${TAG} (D14)" >&2
              status=1
            else
              echo "ok: ${f} = ${FVER} >= tag ${TAG}"
            fi
          done
          exit "$status"
