name: Upstream Watch

on:
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-watch-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  check-upstreams:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
          token: ''
      - name: Check watched omp-build upstream paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/upstream-watch.ts
