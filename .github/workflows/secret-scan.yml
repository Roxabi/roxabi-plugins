name: Secret Scan

permissions:
  contents: read
  checks: read
  pull-requests: read

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  merge_group: {}
  workflow_dispatch: {}

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Processed PR merge → skip suite. Naked push → run suite.
  # ~/projects/ssot/conventions.ssot.md § CI landing
  #
  # GET /commits/{sha}/pulls returns the SIMPLE pull request representation:
  # it carries `state` and `merge_commit_sha` but NOT `merged` (that field only
  # exists on GET /pulls/{number}). A `.merged == true` predicate never matches
  # and every push is classified naked. Fix: `state == "closed" and
  # .merge_commit_sha == $sha`. Matches the generator (dev-core v2.9.1); this
  # committed YAML is patched in place rather than regenerated.
  #
  # Probe is local to this workflow: one gated job, id `trufflehog` (no name:)
  # → {trufflehog}, N=1.
  classify:
    name: Classify push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      path: ${{ steps.out.outputs.path }}
    steps:
      - id: out
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          path=naked
          n=0
          prs="[]"
          for i in 1 2 3 4 5; do
            prs="$(gh api "repos/${REPO}/commits/${SHA}/pulls")"
            n="$(printf '%s' "$prs" | jq --arg sha "$SHA" '[.[] | select(.state == "closed" and .merge_commit_sha == $sha)] | length')"
            if [ "$n" -gt 0 ]; then
              break
            fi
            if [ "$i" -lt 5 ]; then
              sleep 4
            fi
          done
          if [ "$n" -gt 0 ]; then
            head="$(printf '%s' "$prs" | jq -r --arg sha "$SHA" '[.[] | select(.state == "closed" and .merge_commit_sha == $sha)][0].head.sha')"
            ok="$(gh api --paginate "repos/${REPO}/commits/${head}/check-runs" --jq '[.check_runs[] | select(.conclusion == "success") | (.name | ascii_downcase) | select(. == "trufflehog")] | unique | length')"
            if [ "$ok" -ge 1 ]; then
              path=pr-merge
            fi
          fi
          echo "path=${path}" >> "$GITHUB_OUTPUT"
          echo "landing path: ${path}"

  # Job id is the GitHub check name (branch protection contexts use 'trufflehog').
  # Do not set job.name to a different casing — contexts are case-sensitive.
  trufflehog:
    needs: [classify]
    if: always() && !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'push' || needs.classify.outputs.path == 'naked')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # Exclude file must live under the workspace: TruffleHog action runs in Docker
      # with only the repo mounted (RUNNER_TEMP is not visible → exit 1).
      - name: Build exclude list (strip # comments)
        run: |
          set -euo pipefail
          if [ -f scripts/trufflehog-exclude-paths.txt ]; then
            # || true: comment-only file → empty exclude is fine under set -e
            grep -vE '^\s*(#|$)' scripts/trufflehog-exclude-paths.txt \
              > trufflehog-exclude.txt || true
          else
            echo 'node_modules' > trufflehog-exclude.txt
            echo '::warning::scripts/trufflehog-exclude-paths.txt missing — node_modules only'
          fi
      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@47e7b7cd74f578e1e3145d48f669f22fd1330ca6
        with:
          path: ./
          # Diff only — not full history (local pre-push is primary before GitHub)
          base: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          # Relative path = inside Docker workdir (/tmp = checkout)
          extra_args: --only-verified --exclude-paths=trufflehog-exclude.txt
