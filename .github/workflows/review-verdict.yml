# Posts the `review` check run that the PR_Main ruleset requires next to `ci`
# (#1032). The check is bound to one head SHA: a new head has no `review` check,
# so GitHub refuses its merge until a verdict names it.
#
# A verdict is one PR comment line from an account with write access:
#   review-verdict v1 head=<40-hex sha> approve evidence=<https url>
# A head that is the clean merge of a reviewed head with a main commit keeps the
# check. Dependabot semver-minor/patch updates, every commit authored by
# dependabot[bot], get it without a verdict.
#
# Both events run this file from the default branch. Candidate commits are
# fetched as Git objects for scripts/review-verdict.sh; no candidate file runs.
name: Review Verdict

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: review-verdict-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  verdict:
    name: Review verdict
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request && contains(github.event.comment.body, 'review-verdict v1'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verdict comment
        if: github.event_name == 'issue_comment'
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENTER: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
        run: |
          set -euo pipefail
          permission=$(gh api "repos/$REPO/collaborators/$COMMENTER/permission" --jq .permission)
          case "$permission" in
            admin | write) ;;
            *) echo "::error::@$COMMENTER has $permission access; verdict ignored"; exit 1 ;;
          esac
          pr=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '"\(.state) \(.head.sha)"')
          read -r state head <<<"$pr"
          printf '%s' "$COMMENT_BODY" > "$RUNNER_TEMP/comment.txt"
          if ! evidence=$(bash scripts/review-verdict.sh verdict "$RUNNER_TEMP/comment.txt" "$state" "$head" 2>&1); then
            echo "::error::verdict refused: $evidence"
            exit 1
          fi
          gh api "repos/$REPO/check-runs" -f name=review -f head_sha="$head" \
            -f status=completed -f conclusion=success \
            -f 'output[title]=Review verdict' \
            -f "output[summary]=Approved by @$COMMENTER. Evidence: $evidence. Verdict: $COMMENT_URL" >/dev/null
          echo "review check posted on $head"

      - name: Dependabot metadata
        id: dependabot
        if: github.event_name == 'pull_request_target' && github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: ${{ github.token }}

      - name: Dependabot rule or carry-forward
        if: github.event_name == 'pull_request_target'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          UPDATE_TYPE: ${{ steps.dependabot.outputs.update-type }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          post() {
            gh api "repos/$REPO/check-runs" -f name=review -f head_sha="$HEAD_SHA" \
              -f status=completed -f conclusion=success \
              -f 'output[title]=Review verdict' -f "output[summary]=$1" >/dev/null
            echo "review check posted on $HEAD_SHA: $1"
          }
          if [ "$AUTHOR" = 'dependabot[bot]' ]; then
            case "$UPDATE_TYPE" in
              version-update:semver-minor | version-update:semver-patch) ;;
              *) echo "::notice::Dependabot update '$UPDATE_TYPE' needs a verdict"; exit 0 ;;
            esac
            if gh pr view "$PR_NUMBER" --repo "$REPO" --json commits | jq -e \
              '(.commits | length > 0) and all(.commits[]; (.authors | length > 0) and all(.authors[]; .login == "dependabot[bot]"))' >/dev/null; then
              post "Dependabot $UPDATE_TYPE, every commit authored by dependabot[bot]."
            else
              echo "::notice::Dependabot PR has another commit author; it needs a verdict"
            fi
            exit 0
          fi
          git fetch --quiet --no-tags origin "+refs/pull/$PR_NUMBER/head:refs/remotes/pr/head"
          if ! parent=$(bash scripts/review-verdict.sh carry "$HEAD_SHA" "origin/$BASE_REF" 2>&1); then
            echo "::notice::no carry-forward ($parent); this head needs a verdict"
            exit 0
          fi
          reviewed=$(gh api "repos/$REPO/commits/$parent/check-runs?check_name=review" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions" and .conclusion == "success")] | length')
          if [ "$reviewed" -gt 0 ]; then
            post "Carried forward from reviewed head $parent: clean merge with $BASE_REF."
          else
            echo "::notice::first parent $parent has no review check; this head needs a verdict"
          fi
