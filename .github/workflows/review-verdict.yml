# Posts the `review` check run that the PR_Main ruleset requires next to `ci`
# (#1032). The check is bound to one head SHA: a new head has no `review` check,
# so GitHub refuses its merge until a verdict names it.
#
# A verdict is one PR comment line from an account with write access:
#   review-verdict v1 head=<40-hex sha> approve evidence=<https url>
# A head that is the clean merge of a reviewed head with a main commit keeps the
# check. Dependabot semver-minor/patch updates, every commit authored by
# dependabot[bot], get it without a verdict. Only PRs into the default branch
# get the check: a verdict on a stacked PR would not cover what it brings in.
#
# The check is created with the roxabi-ci App token and the ruleset pins
# `review` to that App, so a workflow job that happens to be named `review`
# does not count. Fork PR workflows never see the App key.
#
# Both events run this file from the default branch. Candidate commits are
# fetched as Git objects for scripts/review-verdict.sh; no candidate file runs.
# Each event posts at most one check on one SHA, so runs need no serialization.
name: Review Verdict

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  verdict:
    name: Review verdict
    if: >-
      (github.event_name == 'pull_request_target' &&
        github.event.pull_request.base.ref == github.event.repository.default_branch) ||
      (github.event.issue.pull_request && contains(github.event.comment.body, 'review-verdict v1'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      APP_ID: ${{ vars.ROXABI_CI_APP_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      # Used only to create the `review` check run.
      - name: Mint app token (roxabi-ci)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.ROXABI_CI_APP_ID }}
          private-key: ${{ secrets.ROXABI_CI_APP_PRIVATE_KEY }}
          permission-checks: write

      - name: Verdict comment
        if: github.event_name == 'issue_comment'
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          EVENT_STATE: ${{ github.event.issue.state }}
          COMMENTER: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          COMMENT_CREATED: ${{ github.event.comment.created_at }}
        run: |
          set -euo pipefail
          refuse() { echo "::error::verdict refused: $1"; exit 1; }
          permission=$(gh api "repos/$REPO/collaborators/$COMMENTER/permission" --jq .permission)
          case "$permission" in
            admin | write) ;;
            *) refuse "@$COMMENTER has $permission access" ;;
          esac
          [ "$EVENT_STATE" = open ] || refuse "comment was written on a $EVENT_STATE pull request"
          # The base read now is the one the verdict was written against only if it
          # has not changed since: a verdict on a stacked diff must not survive a retarget.
          # shellcheck disable=SC2016 # GraphQL variables, not shell expansions
          pr=$(gh api graphql -F n="$PR_NUMBER" -f o="${REPO%/*}" -f r="${REPO#*/}" -f query='
            query($o: String!, $r: String!, $n: Int!) { repository(owner: $o, name: $r) { pullRequest(number: $n) {
              state headRefOid baseRefName
              timelineItems(last: 1, itemTypes: [BASE_REF_CHANGED_EVENT]) { nodes { ... on BaseRefChangedEvent { createdAt } } }
            } } }' --jq '.data.repository.pullRequest |
              "\(.state | ascii_downcase) \(.headRefOid) \(.baseRefName) \(.timelineItems.nodes[0].createdAt // "-")"')
          read -r state head base base_changed <<<"$pr"
          [ "$base" = "$DEFAULT_BRANCH" ] || refuse "pull request targets $base, not $DEFAULT_BRANCH"
          if [ "$base_changed" != - ] && [[ ! "$base_changed" < "$COMMENT_CREATED" ]]; then
            refuse "the base branch changed at $base_changed, after the verdict was written"
          fi
          printf '%s' "$COMMENT_BODY" > "$RUNNER_TEMP/comment.txt"
          evidence=$(bash scripts/review-verdict.sh verdict "$RUNNER_TEMP/comment.txt" "$state" "$head" 2>&1) ||
            refuse "$evidence"
          GH_TOKEN=$APP_TOKEN gh api "repos/$REPO/check-runs" -f name=review -f head_sha="$head" \
            -f status=completed -f conclusion=success \
            -f 'output[title]=Review verdict' \
            -f "output[summary]=Approved by @$COMMENTER. Evidence: $evidence. Verdict: $COMMENT_URL" >/dev/null
          echo "review check posted on $head"

      # Refuses when the first PR commit is not Dependabot's; carry-forward must
      # still run then, so a failure here only withholds the automatic approval.
      - name: Dependabot metadata
        id: dependabot
        if: github.event_name == 'pull_request_target' && github.event.pull_request.user.login == 'dependabot[bot]'
        continue-on-error: true
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: ${{ github.token }}

      - name: Dependabot rule or carry-forward
        if: github.event_name == 'pull_request_target'
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          UPDATE_TYPE: ${{ steps.dependabot.outcome == 'success' && steps.dependabot.outputs.update-type || 'unknown' }}
        run: |
          set -euo pipefail
          post() {
            GH_TOKEN=$APP_TOKEN gh api "repos/$REPO/check-runs" -f name=review -f head_sha="$HEAD_SHA" \
              -f status=completed -f conclusion=success \
              -f 'output[title]=Review verdict' -f "output[summary]=$1" >/dev/null
            echo "review check posted on $HEAD_SHA: $1"
          }
          # An eligible Dependabot head gets `review` outright. Any other head,
          # Dependabot's included, can still carry a verdict through a clean merge.
          if [ "$AUTHOR" = 'dependabot[bot]' ]; then
            case "$UPDATE_TYPE" in
              version-update:semver-minor | version-update:semver-patch)
                # The metadata and this read describe the live PR: they count for
                # HEAD_SHA only if it is still the head and the last commit.
                if gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid,commits | jq -e --arg head "$HEAD_SHA" \
                  '.headRefOid == $head and (.commits | length > 0) and .commits[-1].oid == $head and
                   all(.commits[]; (.authors | length > 0) and all(.authors[]; .login == "dependabot[bot]"))' >/dev/null; then
                  post "Dependabot $UPDATE_TYPE, every commit authored by dependabot[bot]."
                  exit 0
                fi
                echo "::notice::head moved or another commit author; trying carry-forward"
                ;;
              *) echo "::notice::Dependabot update '$UPDATE_TYPE' is not minor/patch; trying carry-forward" ;;
            esac
          fi
          git fetch --quiet --no-tags origin "+refs/pull/$PR_NUMBER/head:refs/remotes/pr/head"
          if ! parent=$(bash scripts/review-verdict.sh carry "$HEAD_SHA" "origin/$DEFAULT_BRANCH" 2>&1); then
            echo "::notice::no carry-forward ($parent); this head needs a verdict"
            exit 0
          fi
          reviewed=$(gh api "repos/$REPO/commits/$parent/check-runs?check_name=review&app_id=$APP_ID" | jq --arg app "$APP_ID" \
            '[.check_runs[] | select((.app.id | tostring) == $app and .conclusion == "success")] | length')
          if [ "$reviewed" -gt 0 ]; then
            post "Carried forward from reviewed head $parent: clean merge with $DEFAULT_BRANCH."
          else
            echo "::notice::first parent $parent has no review check; this head needs a verdict"
          fi
