version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
        # Majors excluded from the group → emitted as individual PRs so the
        # auto-merge semver-major guard reviews each one on its own.
        update-types:
          - minor
          - patch
    # github-actions supports ONLY `default-days` — `semver-*-days` are rejected
    # for this ecosystem and made the whole config fail validation. Undefined
    # semver-*-days fall back to default-days, so 3 days applies to every bump.
    cooldown:
      default-days: 3
  # `bun`, not `npm` (#518, ADR-022). The npm updater reads package-lock.json
  # and never writes bun.lock, so it left the lockfile stale while bumping
  # package.json, and CI's `bun install` then re-resolved the floating range.
  # Bun supports both default-days and the semver-*-days cooldown keys.
  #
  # ACCEPTED COST: the bun ecosystem has version updates but NO security
  # updates, and GitHub's dependency graph does not parse bun.lock.
  # That surrenders a capability this repo had ALREADY switched off:
  # dependabot_security_updates is `disabled` at the repository level, and the
  # alert ledger shows fixed=0, dismissed=0 — nothing was ever auto-remediated.
  # Platform-side DETECTION is currently unproven: the open alerts still carry
  # manifest_path=package-lock.json, a file that no longer exists. `bun audit`
  # is the detection path that does not depend on GitHub parsing bun.lock.
  # Accepted because this repo has zero runtime dependencies, eight dev
  # dependencies, and is private. Revisit — and move back to a graph-supported
  # lockfile — if it gains a runtime dependency, is published, or stops being
  # private. See ADR-022.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      bun-dependencies:
        patterns:
          - "*"
        # Majors excluded from the group → emitted as individual PRs so the
        # auto-merge semver-major guard reviews each one on its own.
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 3
