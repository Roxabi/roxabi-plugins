# T2 Canonical taxonomy — review classes
# Version: 1.0.0
# Path: plugins/omp-build/skills/dev-review/review-classes.yml
#
# Frozen snapshot (ADR-020, #492). The class set is the shared vocabulary; the
# graduation cron that once consumed the candidate namespace is dev-core's and is
# NOT snapshotted here — see the candidate-namespace note at the end of this file.
#
# Rules:
#   - canonical classes: use exactly as listed (slug only, no free text)
#   - candidate classes: prefix "candidate/<slug>" — advisory only, never recall-triggering
#   - multi-tag: a finding may carry 0–N canonical tags + 0–1 candidate tag
#   - raw_callsites: required when class is set; format: [{file: str, line: int}]
#
# Readers:
#   - skills/dev-review/SKILL.md — the inline class list in the spawn template
#   - skills/fix/SKILL.md Phase 0 — HALTs when this file is missing or unparseable

version: "1.0.0"

classes:

  # ── Roxabi-origin classes (RC-*) ────────────────────────────────────────────

  - class: test-tautology
    origin: RC-1
    description: >
      Test passes when the guard it validates is removed (tautological assertion).

  - class: generator-drift
    origin: RC-2
    description: >
      Hand-edit to a file that has a generator script (e.g. acl-matrix,
      importlinter contracts, CONFIGURATION.md). The generator will overwrite
      the manual change on next run.

  - class: parallel-path-drift
    origin: RC-3
    description: >
      Safety hardening applied to one entry point but not its sibling
      (e.g. HTTP handler secured, WebSocket handler left open).

  - class: bash-arithmetic-trap
    origin: RC-4a
    description: >
      Bash arithmetic that silently corrupts exit codes: `((c++))` with `set -e`
      (zero value exits the script) · `return >255` (truncated to 8-bit,
      return 256 = return 0).

  - class: bash-error-suppression
    origin: RC-4b
    description: >
      Bash patterns that silently discard errors or coerce unexpected values:
      `2>/dev/null` swallowing stderr · `jq -r` returning literal `"null"` string ·
      `jq //` coercing `false` to a default value.

  - class: target-axis-trap
    origin: RC-5
    description: >
      Duplication along the non-primary axis of decomposition (N×M drift).
      The same architectural concern (try/except, circuit breaker, retry,
      log, sanitize) appears in ≥3 sibling target/adapter dirs instead of
      being composed as a primary-axis primitive.
      Threshold: ≥3 sibling dirs is the canonical trigger (the "three-strikes"
      rule from shared/references/axial-decomposition.md — 2 = coincidence,
      3+ = duplication that must be promoted to a shared primitive).
      Detected against the project's axial ADR (`axial: true` frontmatter
      in `docs/architecture/adr/`).
    note: >
      Subsumption: `parallel-path-drift` (RC-3) is the security-flavoured cousin
      — when a hardening is on one entry point but not its sibling, prefer
      `parallel-path-drift`. `target-axis-trap` is architectural (concern
      duplicated across axis), not security (hardening missing on a sibling).
      The pair MUST be mentioned together in any prose subsumption note —
      enforced by `tools/validate_plugins.py --check subsumption-pairs`.

  - class: vacuous-guard
    origin: RC-6
    description: >
      A test, assert, or check measures a cheap proxy instead of the priced
      quantity (heading presence, denylist of path strings, copied inventory
      list). The control stays green when the invariant is broken.

  # ── OWASP classes ───────────────────────────────────────────────────────────

  - class: shell-injection
    origin: OWASP
    description: >
      `subprocess.run(..., shell=True)` (or equivalent) with user-derived input
      reaching the shell string.

  - class: sql-injection
    origin: OWASP
    description: >
      String-concatenated SQL query with user-derived input; parameterized
      queries not used.

  - class: missing-error-handling
    origin: OWASP
    description: >
      Uncaught coroutine exception · ignored `Result` / `Option` return value.
      See `bare-except` for swallowed-exception patterns (`except: pass`, bare `except`).
    note: >
      Subsumption: when `bare-except` applies to a callsite, tag it as
      `bare-except` only — omit `missing-error-handling` to prevent
      double-counting graduation hits.

  - class: missing-input-validation
    origin: OWASP
    description: >
      External input (HTTP, CLI, env, file) reaches a sensitive sink
      (filesystem, exec, DB, network) without prior validation or sanitization.

  - class: secret-leak
    origin: OWASP
    description: >
      Credentials, API keys, tokens, or private keys present in code, log
      statements, or commit history.

  - class: bare-except
    origin: OWASP
    severity: critical  # advisory only — no consumer reads severity in Slice 1; reserved for Slice 3 dispatch routing
    description: >
      `except Exception: pass` (or equivalent) swallowing errors without
      logging or re-raising.
    note: >
      Strict subset of `missing-error-handling`. Always tag as `bare-except`
      alone; omit `missing-error-handling` (see subsumption rule above).

  - class: path-traversal
    origin: OWASP
    description: >
      User-derived path passed to filesystem operations without normalization
      or containment check (e.g. missing `Path.resolve()` + prefix assertion).

  - class: unbounded-loop
    origin: OWASP
    description: >
      Loop or recursion without a bound, timeout, or circuit-breaker; can
      exhaust CPU or memory under adversarial or unexpected input.

# ── Candidate namespace ─────────────────────────────────────────────────────
#
# Candidates are NOT listed here: a candidate is a slug an agent coins on one
# finding, and it stays on that finding.
#
# Slug format: ^candidate/[a-z][a-z0-9-]{1,48}$  — enforced at parse time.
#   # total max 59 chars (10-char prefix "candidate/" + 1 required-start + up to 48-char suffix)
#   Invalid slug → tag dropped + C(f) := 0. No path components, no whitespace.
#
# Findings tagged candidate/* are advisory only — they never trigger cross-chunk
# recall, and they never promote themselves.
#
# Graduation belongs to dev-core and is not snapshotted: the JSONL store
# (~/.dev-core/candidate-classes.jsonl), its trusted-writer gate and the weekly
# cron all live in that plugin. omp-build writes no candidate store, so promoting
# a recurring candidate into this file is a hand edit, made here, in a PR.
