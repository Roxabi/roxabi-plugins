# Local quality gates — PRIMARY gate (CI is guardrail only).
# SSoT: docs/kit/testing.md · AGENTS.md § Gates techniques · docs/kit/product-consumer-contract.md
#
# Install authority (two paths — do not over-claim prepare alone):
# 1. package.json `prepare`: runs `lefthook install` only when `core.hooksPath` is unset
#    (fresh clone). When hooksPath is set (org/personal shared hooks), prepare is a no-op.
# 2. lefthook npm postinstall: still runs `lefthook install -f` on non-CI installs (upstream
#    evilmartians/lefthook#1475). Force skips the v2 hooksPath guard. Residual: operators
#    with a foreign hooksPath can still get kit hooks written into that path on `bun install`.
#    CI sets CI=true → postinstall skips install. Mitigation until upstream: re-assert shared
#    hooks after install, or install with CI=true when you must not touch hooksPath.
# Keep the vendored lefthook dep so this repo's lefthook.yml can run.
# Skip (emergency only, document why): LEFTHOOK=0 git push
# Policy: fix red HERE — do not push hoping CI will catch it.
#
# Product forks: DO NOT edit this file. deny-upstream is kit-safe (no-op on the kit repo).
# deny-upstream product path is exercised by scripts/kit/test-deny-upstream.sh (CP-DENY), not by
# kit-only pre-push dogfood (kit tree exits 0 before remote checks).

pre-commit:
  commands:
    kit:
      # One process so EXIT restores the index if file-length/trufflehog fail (#148).
      run: bash scripts/kit/lefthook-pre-commit.sh

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

# Full suite before code leaves the machine (= bun run validate:full).
# steps = package.json `validate:full` — do not copy them here.
# Intentional cost: local SoT; CI re-runs as guardrail (skip hooks / env drift).
# (no separate turbo `test` for all pkgs — coverage suites are the unit gate)
# secret-scan: primary = trufflehog-check.sh (pre-commit + pre-push); CI = secondary filet
pre-push:
  parallel: false
  commands:
    # Product consumers: block push to kit upstream. Kit origin = no-op.
    deny-upstream:
      skip: false
      run: bash scripts/kit/deny-upstream-push.sh {1} {2}
    # Fail fast on secrets before long validate:full (CI is too late once pushed)
    trufflehog:
      skip: false
      run: bash scripts/kit/trufflehog-check.sh
    validate-full:
      skip: false
      run: bun run validate:full
    semctx-verify-hook:
      skip: false
      run: bash scripts/kit/lefthook-semctx-verify-hook.sh pre-push

# PR attestation — not a git hook. CI job `semctx-working-empty` runs the same script
# against `git ls-tree` of the PR SHA (required by merge-on-green).
# Feature branches may keep `.semctx/working/*.sem` and still push.
# Local: lefthook run pr
pr:
  commands:
    semctx-working-empty:
      run: bash scripts/kit/check-semctx-working-empty.sh
