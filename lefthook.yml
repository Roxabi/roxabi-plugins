pre-commit:
  commands:
    lint:
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      glob: "*.{ts,tsx,js,jsx}"
    omp-build-quality:
      run: bun run quality:omp-build
      glob: "{plugins/omp-build/**,tools/**/*omp-build*,tools/**/*omp-build*/**}"
    typecheck:
      # tsconfig declares TypeScript roots. `allowJs` permits reachable JavaScript
      # dependencies but does not make arbitrary staged JS a root; keep this
      # TypeScript-only trigger so doc-only commits do not invoke repo-wide tsc.
      run: bun run typecheck
      glob: "*.{ts,tsx}"
    trufflehog:
      run: scripts/trufflehog-check.sh
      skip:
        - merge
        - rebase
    principal-freeze:
      run: bash scripts/check-principal-branch.sh
    taxonomy-sync:
      run: "if [ -f .venv/bin/python ]; then .venv/bin/python tools/validate_plugins.py; else echo 'SKIP: taxonomy-sync (no .venv)' >&2; fi"

commit-msg:
  commands:
    conventional-commits:
      run: bunx commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    test:
      run: bun run test
    trufflehog:
      run: scripts/trufflehog-check.sh
    principal-freeze:
      run: bash scripts/check-principal-branch.sh
    check-no-claude-comments:
      run: scripts/check-no-claude-comments.sh
    check-skill-version:
      run: scripts/check-skill-version.sh
