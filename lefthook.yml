pre-commit:
  commands:
    lint:
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      glob: "*.{ts,tsx,js,jsx}"
    typecheck:
      # tsconfig `include` is *.ts only and allowJs is off, so a commit with no
      # TypeScript staged has nothing to check. Without this glob the step ran
      # a repo-wide tsc on doc-only commits — and failed outright in a fresh
      # worktree, where node_modules (and therefore tsc) does not exist yet.
      run: bun run typecheck
      glob: "*.{ts,tsx}"
    trufflehog:
      run: scripts/trufflehog-check.sh
      skip:
        - merge
        - rebase
    principal-freeze:
      run: bash scripts/check-principal-branch.sh
    license-check:
      run: "if [ -f .venv/bin/python ]; then .venv/bin/python tools/license_check.py; else echo 'SKIP: license-check (no .venv)' >&2; fi"
    taxonomy-sync:
      run: "if [ -f .venv/bin/python ]; then .venv/bin/python tools/validate_plugins.py; else echo 'SKIP: taxonomy-sync (no .venv)' >&2; fi"
    taxonomy-class-list-sync:
      run: "if [ -f .venv/bin/python ]; then .venv/bin/python tools/validate_plugins.py --check class-list-sync; else echo 'SKIP: taxonomy-class-list-sync (no .venv)' >&2; fi"
      glob: "plugins/omp-build/skills/dev-review/{review-classes.yml,SKILL.md}"
    taxonomy-subsumption-pairs:
      run: "if [ -f .venv/bin/python ]; then .venv/bin/python tools/validate_plugins.py --check subsumption-pairs; else echo 'SKIP: taxonomy-subsumption-pairs (no .venv)' >&2; fi"
      glob: "plugins/omp-build/skills/dev-review/{review-classes.yml,SKILL.md}"

commit-msg:
  commands:
    conventional-commits:
      run: bunx commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    test:
      run: bun run test
    trufflehog:
      run: scripts/trufflehog-check.sh
    principal-freeze:
      run: bash scripts/check-principal-branch.sh
    check-no-claude-comments:
      run: scripts/check-no-claude-comments.sh
    check-skill-version:
      run: scripts/check-skill-version.sh
