pre-commit:
  commands:
    lint:
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      glob: "*.{ts,tsx,js,jsx}"
    omp-build-quality:
      run: bun run quality:omp-build
      glob: "{plugins/omp-build/**,tools/**/*omp-build*,tools/**/*omp-build*/**}"
    typecheck:
      # tsconfig declares TypeScript roots. `allowJs` permits reachable JavaScript
      # dependencies but does not make arbitrary staged JS a root; keep this
      # TypeScript-only trigger so doc-only commits do not invoke repo-wide tsc.
      run: bun run typecheck
      glob: "*.{ts,tsx}"
    trufflehog:
      run: scripts/trufflehog-check.sh
      skip:
        - merge
        - rebase
    principal-freeze:
      run: bash scripts/check-principal-branch.sh
    taxonomy-sync:
      run: "if [ -f .venv/bin/python ]; then .venv/bin/python tools/validate_plugins.py; else echo 'SKIP: taxonomy-sync (no .venv)' >&2; fi"

commit-msg:
  commands:
    conventional-commits:
      run: bunx commitlint --edit {1}

# Fast checks only. The integration project runs in the required `ci` check, which
# the strict up-to-date rule makes run on the proposed merge with current `main`.
pre-push:
  parallel: true
  # Lefthook skips pre-push commands when HEAD has no diff against origin/main.
  scripts:
    unit.sh:
      runner: bash
      args: "--"
      priority: 1
    lint.sh:
      runner: bash
      args: "--"
      priority: 2
    typecheck.sh:
      runner: bash
      args: "--"
      priority: 3
    trufflehog.sh:
      runner: bash
      args: "--"
      priority: 4
    principal-freeze.sh:
      runner: bash
      args: "--"
      priority: 5
    check-no-claude-comments.sh:
      runner: bash
      args: "--"
      priority: 6
    check-skill-version.sh:
      runner: bash
      args: "--"
      priority: 7
